[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerberus-coo"
version = "0.1.0"
description = "Cerberus High-Speed Imager Control System"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "astropy",
    "matplotlib",
    "scipy",
    "haletcs",
]

[project.optional-dependencies]
qt = ["PyQt6>=6.5"]

[tool.setuptools]
# Tell setuptools to include the package and all subpackages
packages = [
    "cerberus_coo",
    "cerberus_coo.api",
    "cerberus_coo.acquisition",
    "cerberus_coo.gui",
    "cerberus_coo.gui.panels",
    "cerberus_coo.hardware",
    "cerberus_coo.hardware.camera",
    "cerberus_coo.hardware.dcam",
    "cerberus_coo.hardware.telescope",
    "cerberus_coo.focusloop",
    "cerberus_coo.filterwheel",
    "cerberus_coo.guiding",
    "cerberus_coo.gui_qt",
    "cerberus_coo.gui_qt.panels",
    "cerberus_coo.gui_qt.widgets",
    "cerberus_coo.gui_qt.windows",
    "cerberus_coo.simulation",
]

[tool.setuptools.package-dir]
# Map cerberus_coo to the current directory (cerberus-coo)
"cerberus_coo" = "."

